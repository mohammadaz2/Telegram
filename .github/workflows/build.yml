name: Build Telegram APK (arm64, cached)

on:
  push:
    branches: [ feature/user-id-profile-row, main, master ]
  workflow_dispatch:

# A newer push supersedes an in-flight run instead of burning minutes twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1
  # ccache lives in the workspace so one cache path covers it.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_NOHASHDIR: "true"
  # NDK/CMake rewrite mtimes and embed absolute paths; without this nearly nothing hits.
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

jobs:
  build:
    name: Build Telegram APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # The cached SDK/NDK was written by root; tar cannot overwrite root-owned
      # files, so the restore used to fail silently. Hand the paths to the runner.
      - name: Fix SDK ownership for cache restore
        run: |
          for p in \
            "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" \
            "$ANDROID_SDK_ROOT/cmake/$CMAKE_VERSION" \
            "$ANDROID_SDK_ROOT/platforms/android-36" \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0"; do
            [ -e "$p" ] && sudo chown -R "$(id -u):$(id -g)" "$p"
          done
          exit 0

      - name: Restore Android SDK / NDK / CMake
        uses: actions/cache/restore@v4
        id: cache-ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/36.0.0
          key: ${{ runner.os }}-android-sdk-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK & SDK Components
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Save Android SDK / NDK / CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{ runner.os }}-android-sdk-ndk-${{ env.NDK_VERSION }}
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.CMAKE_VERSION }}
            /usr/local/lib/android/sdk/platforms/android-36
            /usr/local/lib/android/sdk/build-tools/36.0.0

      - name: Install Ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          ccache --version

      # Native build dirs are deliberately NOT cached: checkout stamps sources
      # newer than the restored .o files, so ninja rebuilds everything anyway.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # rolling key: one fresh entry per attempt, restore-keys always seeds from
          # the newest previous run so the ccache keeps growing across pushes.
          key: ${{ runner.os }}-ccache-arm64-v8a-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-ccache-arm64-v8a-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-arm64-v8a-
            ${{ runner.os }}-ccache-

      # Must run AFTER the restore: the restored cache contains an old ccache.conf
      # and the pre-restore `ccache -M` settings would be overwritten.
      - name: Configure Ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=sloppiness=$CCACHE_SLOPPINESS
          ccache -z
          ccache -s

      - name: Set Environment Variables
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --stacktrace --build-cache --parallel -Dorg.gradle.caching=true
          echo "--- ccache stats ---"
          ccache -s

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-arm64-v8a-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Custom-APK-arm64
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          # the APK is already compressed
          compression-level: 0
          retention-days: 30
